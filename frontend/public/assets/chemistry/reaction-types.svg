<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc"><title id="title">Types of chemical reactions</title><desc id="desc">General reaction patterns</desc><rect width="1024" height="640" fill="#0c1729"/><rect x="24" y="22" width="976" height="596" rx="28" fill="none" stroke="#45647e" stroke-width="2"/><text x="55" y="79" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#eef7fc">Types of chemical reactions</text><text x="56" y="118" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="500" fill="#b5cadd">General reaction patterns</text><rect x="77" y="165" width="866" height="369" rx="16" fill="#152941" stroke="#45647e" stroke-width="2"/><rect x="100" y="197" width="391" height="147" rx="16" fill="#152941" stroke="#45647e" stroke-width="2"/><text x="295" y="248" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="500" fill="#66e3cf">Synthesis</text><text x="295" y="301" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="500" fill="#eef7fc">A + B → AB</text><rect x="532" y="197" width="391" height="147" rx="16" fill="#152941" stroke="#45647e" stroke-width="2"/><text x="727" y="248" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="500" fill="#66e3cf">Decomposition</text><text x="727" y="301" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="500" fill="#eef7fc">AB → A + B</text><rect x="100" y="366" width="391" height="147" rx="16" fill="#152941" stroke="#45647e" stroke-width="2"/><text x="295" y="417" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="500" fill="#66e3cf">Single replacement</text><text x="295" y="470" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="500" fill="#eef7fc">A + BC → AC + B</text><rect x="532" y="366" width="391" height="147" rx="16" fill="#152941" stroke="#45647e" stroke-width="2"/><text x="727" y="417" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="500" fill="#66e3cf">Combustion</text><text x="727" y="470" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="500" fill="#eef7fc">Fuel + O₂ → CO₂ + H₂O</text><path d="M55 564 L969 564" fill="none" stroke="#45647e" stroke-width="1" stroke-linecap="round"/><text x="56" y="590" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="500" fill="#b5cadd">Schematic illustration • not to scale</text><text x="970" y="591" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="500" fill="#66e3cf">StudyCade • CC0</text></svg>

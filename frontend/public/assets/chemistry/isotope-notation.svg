<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc"><title id="title">Isotope and ion notation</title><desc id="desc">Upper/lower nuclear notation and neutron counting</desc><rect width="1024" height="640" fill="#0c1729"/><rect x="24" y="22" width="976" height="596" rx="28" fill="none" stroke="#45647e" stroke-width="2"/><text x="55" y="79" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#eef7fc">Isotope and ion notation</text><text x="56" y="118" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="500" fill="#b5cadd">Upper/lower nuclear notation and neutron counting</text><rect x="90" y="172" width="842" height="335" rx="16" fill="#152941" stroke="#45647e" stroke-width="2"/><text x="330" y="360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="115" font-weight="500" fill="#66e3cf">¹⁴₆C</text><text x="645" y="251" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="500" fill="#eef7fc">Atomic number Z = 6</text><text x="645" y="309" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="500" fill="#eef7fc">Mass number A = 14</text><text x="645" y="375" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="500" fill="#ffcc75">Neutrons = 14 − 6 = 8</text><text x="640" y="441" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="500" fill="#b5cadd">Neutral carbon: 6 electrons</text><path d="M55 564 L969 564" fill="none" stroke="#45647e" stroke-width="1" stroke-linecap="round"/><text x="56" y="590" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="500" fill="#b5cadd">Schematic illustration • not to scale</text><text x="970" y="591" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="500" fill="#66e3cf">StudyCade • CC0</text></svg>

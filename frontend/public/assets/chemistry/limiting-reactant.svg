<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc"><title id="title">Limiting reactant</title><desc id="desc">One O₂ limits water formed from four H₂</desc><rect width="1024" height="640" fill="#0c1729"/><rect x="24" y="22" width="976" height="596" rx="28" fill="none" stroke="#45647e" stroke-width="2"/><text x="55" y="79" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#eef7fc">Limiting reactant</text><text x="56" y="118" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="500" fill="#b5cadd">One O₂ limits water formed from four H₂</text><rect x="73" y="173" width="878" height="360" rx="16" fill="#152941" stroke="#45647e" stroke-width="2"/><text x="507" y="267" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="43" font-weight="500" fill="#eef7fc">4 H₂ + 1 O₂</text><path d="M400 319 L629 319" fill="none" stroke="#66e3cf" stroke-width="6" stroke-linecap="round"/><path d="M629 319 l-10.2 6.3 M629 319 l-10.2 -6.3" stroke="#66e3cf" stroke-width="6" fill="none" stroke-linecap="round"/><text x="512" y="392" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="33" font-weight="500" fill="#ffcc75">2 H₂O + 2 H₂ left over</text><text x="512" y="474" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="500" fill="#b5cadd">O₂ is limiting; H₂ is in excess.</text><path d="M55 564 L969 564" fill="none" stroke="#45647e" stroke-width="1" stroke-linecap="round"/><text x="56" y="590" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="500" fill="#b5cadd">Schematic illustration • not to scale</text><text x="970" y="591" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="500" fill="#66e3cf">StudyCade • CC0</text></svg>

# Retain the old Compose project identity so renaming the folder keeps the existing database volume.
name: chem-arcade-server
services:
  app:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp
    environment:
      DB_PATH: /data/arcade.db
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?Set your team domain}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?Set your Access audience}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set your admin email}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set your app URL}
    volumes:
      - arcade_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      app:
        condition: service_healthy
volumes:
  arcade_data:
secrets:
  tunnel_token:
    file: ./secrets/tunnel_token
